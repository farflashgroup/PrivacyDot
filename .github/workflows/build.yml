name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\PrivacyDot.slnx

      - name: Build
        run: dotnet build .\PrivacyDot.slnx -c Release --no-restore

      - name: Test
        run: .\PrivacyDot.Tests\bin\Release\net48\PrivacyDot.Tests.exe

      - name: Build installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\installer\BuildInstaller.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrivacyDotSetup
          path: artifacts\PrivacyDotSetup.exe
